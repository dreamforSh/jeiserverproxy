name: JEIServerProxy
version: '${version}'
main: com.xinian.jeiserverproxy.JEIServerProxy
api-version: '26.1.2'
author: Rique
description: Bridges JEI and REI recipe helpers on Paper servers.
commands:
  jeiproxy:
    description: Main JEIServerProxy command.
    usage: /<command> <reload|handshake>
    permission: jeiserverproxy.admin
permissions:
  jeiserverproxy.admin:
    description: Allows use of JEIServerProxy admin commands.
    default: op
  jeiserverproxy.cheat:
    description: Allows JEI cheat-mode bridge actions.
    default: op
